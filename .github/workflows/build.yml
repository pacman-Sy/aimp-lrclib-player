name: build-aimp-clone

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK platform and build tools
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Locate APK
        id: apk
        run: echo "path=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)" >> "$GITHUB_OUTPUT"

      - name: Upload to gofile
        id: gofile
        run: |
          RESP=$(curl -s -F "file=@${{ steps.apk.outputs.path }}" https://upload.gofile.io/uploadFile)
          echo "$RESP" > gofile.json
          PAGE=$(echo "$RESP" | jq -r '.data.downloadPage')
          echo "page=$PAGE" >> "$GITHUB_OUTPUT"
          echo "### AIMP clone build" >> "$GITHUB_STEP_SUMMARY"
          echo "Download: $PAGE" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: aimp-clone
          path: ${{ steps.apk.outputs.path }}
